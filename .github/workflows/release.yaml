name: Auto-Version

on:
  push:
    branches:
      - main

jobs:
  tag:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: '0'

      - name: Get Repo Details
        run: |
          echo "COMMIT_TYPE=$(echo $GITHUB_REF | cut -d / -f 2)" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d / -f 2-)" >> $GITHUB_ENV
          echo "REPO_VERSION=$(echo $GITHUB_REF | cut -d / -f 3-)" >> $GITHUB_ENV

      - name: Bump version and push tag
        id: bump
        if: env.COMMIT_TYPE != 'tags'
        uses: anothrNick/github-tag-action@1.52.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCHES: main
          WITH_V: true

      # Publishes the browser assets for the new version to
      # https://assets.invopop.com/popui/<version>/ (the "assets" R2 bucket).
      # This runs here because tags pushed with GITHUB_TOKEN don't start other
      # workflows. Published versions are immutable and never overwritten.
      - name: Set up Go
        if: steps.bump.outputs.new_tag != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CDN assets
        if: steps.bump.outputs.new_tag != ''
        run: scripts/cdn-dist.sh dist

      - name: Publish CDN assets
        if: steps.bump.outputs.new_tag != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't accept the checksums newer AWS CLIs send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: popui/${{ steps.bump.outputs.new_tag }}
        run: |
          if aws s3api head-object --endpoint-url "$ENDPOINT" --bucket assets --key "$PREFIX/popui.wasm" >/dev/null 2>&1; then
            echo "$PREFIX is already published."
            exit 0
          fi
          for file in dist/*; do
            case "$file" in
              *.wasm) type=application/wasm ;;
              *.js) type="text/javascript; charset=utf-8" ;;
              *.css) type="text/css; charset=utf-8" ;;
              *.woff2) type=font/woff2 ;;
              *.txt) type="text/plain; charset=utf-8" ;;
              *) echo "No content type for $file" >&2; exit 1 ;;
            esac
            aws s3 cp "$file" "s3://assets/$PREFIX/$(basename "$file")" \
              --endpoint-url "$ENDPOINT" \
              --content-type "$type" \
              --cache-control "public, max-age=31536000, immutable"
          done
          echo "Published https://assets.invopop.com/$PREFIX/"
